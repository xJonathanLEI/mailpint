<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Mailpint</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#message-list">Skip to messages</a>
    <div class="app">
      <nav class="sidebar" aria-label="Mailbox">
        <a class="brand" href="#inbox" aria-label="Mailpint inbox">
          <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <rect width="40" height="40" rx="12" fill="currentColor" />
            <path d="M10 10h20l-3 21H13l-3-21Z" stroke="var(--on-accent)" stroke-width="1.8" stroke-linejoin="round" />
            <path d="m12 16 8 6 8-6M13 27h14" stroke="var(--on-accent)" stroke-width="1.8" stroke-linejoin="round" />
          </svg>
          <span>mailpint<span class="brand-caption">A pint-sized inbox</span></span>
        </a>
        <div class="nav-label">MAILBOX</div>
        <button class="nav-item active" id="all-mail" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4-2 10v6h20v-6L20 4H4Z M2 14h6l2 3h4l2-3h6" /></svg>
          Inbox <span id="all-count" class="count">0</span>
        </button>
        <button class="nav-item" id="unread-mail" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 6 9 7 9-7" /></svg>
          Unread <span id="unread-count" class="count">0</span>
        </button>
        <button id="theme" class="theme-button quiet" type="button" aria-label="Dark theme" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13a9 9 0 0 1-9.9-9.9A9 9 0 1 0 20.9 13Z" /></svg>
          <span class="theme-label">Dark theme</span>
        </button>
      </nav>
      <main id="inbox" class="workspace">
        <header class="workspace-header">
          <div class="heading-group"><h1>Inbox</h1><span id="header-count">Loading…</span></div>
          <div class="header-actions">
            <button id="refresh" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10a8 8 0 1 0-2 8M20 4v6h-6" /></svg>
              Refresh
            </button>
            <button id="clear-inbox" class="quiet danger-text" type="button" disabled>Clear inbox</button>
          </div>
        </header>
        <div id="refresh-error" class="error-banner" role="status" hidden>
          <span id="error-copy"></span><button id="retry" type="button">Try again</button>
        </div>
        <div class="panes">
          <section class="inbox-pane" aria-label="Message inbox">
            <div class="search-wrap">
              <label class="sr-only" for="search">Filter sender, recipient or subject</label>
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6" /><path d="m15 15 5 5" /></svg>
              <input id="search" type="search" placeholder="Filter messages…" autocomplete="off" maxlength="998" />
            </div>
            <div class="list-heading"><span id="list-label">ALL MESSAGES</span><span>NEWEST FIRST</span></div>
            <div id="message-list" class="message-list" tabindex="-1" aria-busy="true"></div>
            <footer class="list-footer">
              <span id="range">Loading messages…</span>
              <div>
                <button id="newer" type="button" aria-label="Newer messages" disabled>←</button>
                <button id="older" type="button" aria-label="Older messages" disabled>→</button>
              </div>
            </footer>
          </section>
          <section class="reader" aria-label="Message reader">
            <div id="reader-content" class="reader-content" hidden>
              <div class="reader-toolbar">
                <button id="back" type="button" class="back-button">← Back to inbox</button>
                <div class="message-actions">
                  <button id="toggle-read" type="button">Mark unread</button>
                  <button id="delete-message" type="button" class="quiet" aria-label="Delete message">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7" /></svg>
                    <span>Delete</span>
                  </button>
                </div>
              </div>
              <div class="message-heading">
                <h2 id="subject">Message</h2>
                <div class="sender-line">
                  <span id="avatar" class="avatar" aria-hidden="true"></span>
                  <div><strong id="sender-name"></strong><span id="sender-email" class="address"></span></div>
                </div>
                <dl class="message-meta">
                  <div><dt>To</dt><dd id="recipient"></dd></div>
                  <div><dt>Received</dt><dd><time id="received-at"></time></dd></div>
                </dl>
              </div>
              <div class="body-controls">
                <fieldset class="view-switch">
                  <legend class="sr-only">Message view</legend>
                  <button id="view-html" type="button" aria-pressed="true">HTML</button>
                  <button id="view-text" type="button" aria-pressed="false">Text</button>
                </fieldset>
              </div>
              <div class="body-region">
                <iframe id="html-body" title="Email HTML preview" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe>
                <div id="text-body" class="text-body" hidden><pre id="plain-text"></pre></div>
              </div>
            </div>
            <div id="reader-empty" class="reader-empty"></div>
          </section>
        </div>
        <div id="announcement" class="announcement" role="status" aria-live="polite"></div>
      </main>
    </div>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-description">
      <form method="dialog">
        <h2 id="confirm-title">Delete this message?</h2>
        <p id="confirm-description"></p>
        <div class="dialog-actions">
          <button value="cancel" type="submit" autofocus>Cancel</button>
          <button id="confirm-action" class="destructive" value="confirm" type="submit">Delete</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
